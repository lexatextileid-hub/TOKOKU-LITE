<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOKOKU Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Warna dan ukuran dasar. Ubah di sini, semua halaman ikut. */
:root {
  --biru: #1e5bd8;
  --biru-tua: #1743a6;
  --biru-muda: #e8effc;
  --biru-garis: #c9d7f5;

  --latar: #f4f6fa;
  --permukaan: #ffffff;
  --permukaan-2: #f5f7fb;

  --teks: #172033;
  --teks-2: #485163;
  --teks-3: #5b6475;
  --teks-pudar: #7a8396;

  --garis: #e2e6ee;
  --garis-kuat: #d6dce6;
  --garis-halus: #edf0f5;

  --peringatan: #8a5a00;
  --peringatan-latar: #fff6e3;
  --bahaya: #b42318;
  --bahaya-latar: #fdecea;

  --radius: 8px;
  --radius-besar: 12px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  color: var(--teks);
  background: var(--latar);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--biru); }
a:hover { color: var(--biru-tua); }

h1, h2, h3 { margin: 0; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 700; }

:focus-visible { outline: 2px solid var(--biru); outline-offset: 2px; }

/* ---------- Tombol ---------- */
.tombol {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border-radius: var(--radius); border: 1px solid var(--garis-kuat);
  background: var(--permukaan); font-weight: 600; cursor: pointer;
  text-decoration: none; color: var(--teks); white-space: nowrap;
}
.tombol:hover { background: var(--permukaan-2); color: var(--teks); }
.tombol:disabled { opacity: 0.5; cursor: not-allowed; }
.tombol--utama { background: var(--biru); border-color: var(--biru); color: #fff; }
.tombol--utama:hover { background: var(--biru-tua); color: #fff; }
.tombol--hantu { border-color: transparent; background: transparent; color: var(--teks-2); font-weight: 500; }
.tombol--hantu:hover { background: var(--permukaan-2); }
.tombol--putus { border-style: dashed; color: var(--biru-tua); }
.tombol--besar { height: 52px; font-size: 16px; }
.tombol--kecil { height: 32px; padding: 0 10px; font-size: 13px; }

/* ---------- Isian ---------- */
.isian { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.isian__kontrol {
  height: 42px; padding: 0 12px;
  border: 1px solid var(--garis-kuat); border-radius: var(--radius);
  background: var(--permukaan); font-size: 14px; font-weight: 400;
}
.isian__bantuan { font-size: 12px; font-weight: 400; color: var(--teks-3); }

/* ---------- Kartu & label ---------- */
.kartu {
  background: var(--permukaan); border: 1px solid var(--garis);
  border-radius: var(--radius-besar); padding: 20px;
}
.lencana {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: 4px; font-size: 11.5px; font-weight: 600;
  background: var(--biru-muda); color: var(--biru-tua);
}
.lencana--peringatan { background: var(--peringatan-latar); color: var(--peringatan); }
.lencana--bahaya { background: var(--bahaya-latar); color: var(--bahaya); }
.lencana--netral { background: var(--permukaan-2); color: var(--teks-2); }

.label-kecil {
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--teks-3);
}
.teks-pudar { color: var(--teks-3); }

/* ---------- Pola bersama ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tumpuk { display: flex; flex-direction: column; gap: 14px; }
.baris-isian { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.dua-kolom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.baris-tombol { display: flex; gap: 8px; flex-wrap: wrap; }
.tautan { border: none; background: none; padding: 0; color: var(--biru); font-weight: 600; font-size: 13px; cursor: pointer; }
.tautan:hover { color: var(--biru-tua); text-decoration: underline; }
.kotak { border: 1px solid var(--garis); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--permukaan-2); }
.centang { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.centang input { width: 18px; height: 18px; accent-color: var(--biru); flex: none; }

.ringkas-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.ringkas-total--besar { font-size: 16px; }
.ringkas-total--besar strong { font-size: 22px; }
.ringkas-total--hijau strong { color: var(--biru-tua); font-size: 20px; }

.catatan { margin: 0; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; }
.catatan--info { background: var(--biru-muda); color: var(--biru-tua); }
.catatan--peringatan { background: var(--peringatan-latar); color: var(--peringatan); }
.catatan--bahaya { background: var(--bahaya-latar); color: var(--bahaya); }

.input-rp {
  display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px;
  border: 1px solid var(--garis-kuat); border-radius: var(--radius); background: var(--permukaan);
  font-weight: 400;
}
.input-rp span { color: var(--teks-3); font-size: 13px; }
.input-rp input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 16px; text-align: right; }
.input-rp:focus-within { outline: 2px solid var(--biru); outline-offset: 1px; }
.input-rp--kecil { height: 32px; padding: 0 8px; width: 130px; }
.input-rp--kecil input { font-size: 14px; }

.saklar { display: inline-flex; border: 1px solid var(--garis-kuat); border-radius: var(--radius); overflow: hidden; height: 42px; }
.saklar button { border: none; background: var(--permukaan); padding: 0 14px; font-weight: 600; cursor: pointer; }
.saklar button + button { border-left: 1px solid var(--garis-kuat); }
.saklar button[aria-pressed='true'] { background: var(--biru); color: #fff; }

/* ---------- Dialog ---------- */
.dialog-latar {
  position: fixed; left: 0; right: 0; top: 0; height: 100dvh; z-index: 50;
  background: rgba(23, 32, 51, 0.45);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.dialog {
  background: var(--permukaan); border-radius: var(--radius-besar); width: 100%; max-height: 100%;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 48px rgba(23, 32, 51, 0.25);
}
.dialog__kepala { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px 6px 20px; }
.dialog__isi { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog__isi > * { flex-shrink: 0; } /* isi panjang digulir, bukan digencet */
.dialog__kaki { flex: none; padding: 12px 20px 16px; border-top: 1px solid var(--garis); display: flex; flex-direction: column; gap: 10px; background: var(--permukaan); }

@media (max-width: 860px) {
  .dialog-latar { align-items: flex-end; padding: 0; }
  .dialog { max-width: none !important; border-radius: 16px 16px 0 0; max-height: calc(100% - 24px); }
  .dialog__kaki { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
.tombol--merah { background: var(--bahaya); border-color: var(--bahaya); color: #fff; }
.tombol--merah:hover { background: #a3271c; border-color: #a3271c; color: #fff; }
.tautan.teks-bahaya { color: var(--bahaya); }

/* ---------- Kerangka aplikasi: menu samping (tablet/komputer), menu bawah (HP) ---------- */
.app { height: 100%; display: flex; }

.samping {
  width: 248px; flex: none; height: 100%; overflow-y: auto;
  background: var(--permukaan); border-right: 1px solid var(--garis);
  display: flex; flex-direction: column; gap: 12px; padding: 14px 10px;
}
.app--ciut .samping { width: 72px; align-items: center; }

.samping__merek { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.merek__logo {
  width: 36px; height: 36px; border-radius: var(--radius); flex: none;
  background: var(--biru); color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.merek__nama { font-weight: 700; font-size: 15px; }
.merek__sub { font-size: 12px; color: var(--teks-3); }

.samping__mode { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--permukaan-2); border-radius: var(--radius); padding: 3px; gap: 2px; }
.samping__mode a {
  display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: var(--teks-2); text-decoration: none; text-align: center; line-height: 1.1;
}
.samping__mode a.aktif { background: var(--permukaan); color: var(--biru-tua); box-shadow: 0 1px 2px rgba(23, 32, 51, 0.12); }
.samping__mode-ciut {
  width: 40px; height: 32px; border-radius: var(--radius); background: var(--biru-muda); color: var(--biru-tua);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}

.samping__menu { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.samping__item {
  display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px;
  border-radius: var(--radius); color: var(--teks-2); font-weight: 500; text-decoration: none;
}
.samping__item:hover { background: var(--permukaan-2); color: var(--teks); }
.samping__item.active { background: var(--biru-muda); color: var(--biru-tua); font-weight: 600; }
.app--ciut .samping__item { justify-content: center; padding: 0; }

.samping__anak { display: flex; flex-direction: column; margin: 2px 0 6px 22px; padding-left: 12px; border-left: 2px solid var(--garis); }
.samping__anak a { display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 6px; font-size: 13.5px; color: var(--teks-2); text-decoration: none; }
.samping__anak a:hover { background: var(--permukaan-2); }
.samping__anak a.active { color: var(--biru-tua); font-weight: 600; background: var(--biru-muda); }

.app__kanan { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.app__isi { flex: 1; min-height: 0; overflow: auto; }

/* Bilah judul */
.kepala {
  flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 20px 0 12px;
  background: var(--permukaan); border-bottom: 1px solid var(--garis);
}
.kepala__tombol {
  width: 40px; height: 40px; flex: none; border: none; border-radius: var(--radius);
  background: transparent; color: var(--teks-2); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.kepala__tombol:hover { background: var(--permukaan-2); color: var(--teks); }
.kepala__judul { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--biru-tua); }
.kepala__judul h1 {
  font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teks);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kepala__pemisah { color: var(--garis-kuat); }
.kepala__sub { font-size: 14px; color: var(--teks-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kepala__kanan { margin-left: auto; display: flex; align-items: center; gap: 16px; flex: none; }
.kepala__tanggal { font-size: 13px; color: var(--teks-3); }
.kepala__pengguna { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.kepala__peran {
  height: 32px; border: 1px solid var(--garis-kuat); border-radius: var(--radius); background: var(--permukaan-2);
  font-size: 12.5px; font-weight: 600; padding: 0 6px; cursor: pointer;
}
.kepala__avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--biru-muda); color: var(--biru-tua);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}

/* Menu bawah (HP) */
.bawah { display: none; }
.bawah__item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: none; background: none; color: var(--teks-3); font-size: 11px; font-weight: 600; text-decoration: none; cursor: pointer;
}
.bawah__item.active { color: var(--biru); }

.laci-latar { position: fixed; inset: 0; background: rgba(23, 32, 51, 0.45); z-index: 40; }
.laci {
  position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--permukaan);
  display: flex; flex-direction: column; gap: 12px; padding: 16px 12px; overflow-y: auto;
}

@media (max-width: 860px) {
  .samping { display: none; }
  .app__isi { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .kepala { height: 52px; padding: 0 12px 0 6px; }
  .kepala__tanggal, .kepala__akun { display: none; }
  .bawah {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(64px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--permukaan); border-top: 1px solid var(--garis);
  }
}

/* ---------- Halaman modul yang belum dibangun ---------- */
.rencana { max-width: 760px; display: flex; flex-direction: column; gap: 16px; padding: 24px; }
.rencana ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--teks-2); }

@media (max-width: 520px) {
  .kepala__pemisah, .kepala__sub { display: none; }
  .kepala__judul h1 { font-size: 13.5px; letter-spacing: 0.03em; white-space: normal; line-height: 1.2; }
  .kepala__kanan { gap: 8px; }
}

/* ---------- Layar Penjualan ---------- */
.pj { height: 100%; display: flex; flex-wrap: wrap; }
.pj__barang { flex: 999 1 520px; min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }
.pj__cari-kotak {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px;
  background: var(--permukaan); border: 1px solid var(--garis-kuat); border-radius: 10px; color: var(--teks-3);
}
.pj__cari-kotak input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: var(--teks); }
.pj__cari-kotak:focus-within { outline: 2px solid var(--biru); outline-offset: 1px; }

.pj__kategori { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; flex: none; }
.pj__kategori button {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--garis-kuat);
  background: var(--permukaan); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.pj__kategori button[aria-pressed='true'] { background: var(--biru); border-color: var(--biru); color: #fff; }

.pj__grid {
  flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 10px; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); padding-bottom: 8px;
}
.kartu-barang {
  text-align: left; background: var(--permukaan); border: 1px solid var(--garis); border-radius: 10px;
  padding: 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-height: 118px;
}
.kartu-barang:hover { border-color: var(--biru-garis); background: #fbfcff; }
.kartu-barang__sku { font-size: 11px; color: var(--teks-3); letter-spacing: 0.03em; }
.kartu-barang__nama { font-weight: 600; line-height: 1.3; }
.kartu-barang__harga { font-weight: 700; margin-top: auto; }
.kartu-barang__lain { font-size: 12px; color: var(--biru-tua); }
.kartu-barang__stok { font-size: 12px; color: var(--teks-3); }
.kartu-barang__stok--habis { color: var(--bahaya); }
.pj__kosong { grid-column: 1 / -1; color: var(--teks-3); text-align: center; padding: 32px 12px; list-style: none; }

.pj__keranjang {
  flex: 1 1 380px; min-width: 0; min-height: 0; height: 100%;
  background: var(--permukaan); border-left: 1px solid var(--garis); display: flex; flex-direction: column;
}
.pj__tertahan { padding: 10px 16px; border-bottom: 1px solid var(--garis); background: var(--peringatan-latar); display: flex; flex-direction: column; gap: 6px; }
.pj__tertahan-daftar { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-tahan { height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #e8cf96; background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
.chip-tahan span { font-weight: 400; color: var(--teks-3); margin-left: 4px; }

.pj__pelanggan { padding: 12px 16px; border-bottom: 1px solid var(--garis); display: flex; flex-direction: column; gap: 6px; }
.pj__pelanggan-atas { display: flex; justify-content: space-between; align-items: center; }
.pj__info { margin: 0; font-size: 12.5px; color: var(--teks-2); }

.pj__baris { list-style: none; margin: 0; padding: 0 16px; flex: 1; min-height: 0; overflow-y: auto; }
.kr-baris { padding: 12px 0; border-bottom: 1px solid var(--garis-halus); display: flex; flex-direction: column; gap: 8px; }
.kr-baris__atas { display: flex; justify-content: space-between; gap: 8px; }
.kr-baris__nama { font-weight: 600; line-height: 1.3; }
.kr-baris__sku { font-size: 11px; color: var(--teks-3); }
.kr-baris__tengah { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kr-baris__harga { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }

.chip-satuan { display: flex; gap: 4px; flex-wrap: wrap; }
.chip-satuan button {
  height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--garis-kuat);
  background: var(--permukaan); font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.chip-satuan button[aria-pressed='true'] { background: var(--biru); border-color: var(--biru); color: #fff; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--garis-kuat); border-radius: var(--radius); overflow: hidden; height: 34px; }
.stepper button { width: 34px; height: 100%; border: none; background: var(--permukaan-2); font-size: 16px; cursor: pointer; }
.stepper input { width: 60px; height: 100%; border: none; text-align: center; font-weight: 600; outline: none; }

.kr-diskon { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--permukaan-2); border-radius: var(--radius); padding: 6px 8px; font-size: 12.5px; color: var(--teks-2); }

.pj__total { border-top: 1px solid var(--garis); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.pj__aksi { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 4px; }
.pj__aksi .tombol { height: 52px; }

/* Pilih satuan */
.pilih-satuan { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.pilih-satuan__item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; min-height: 96px;
  border: 1px solid var(--garis-kuat); border-radius: 10px; background: var(--permukaan); cursor: pointer; text-align: left;
}
.pilih-satuan__item:hover { border-color: var(--biru); background: var(--biru-muda); }
.pilih-satuan__label { font-weight: 700; }
.pilih-satuan__harga { font-size: 16px; font-weight: 700; color: var(--biru-tua); }
.pilih-satuan__isi { font-size: 12px; color: var(--teks-3); }

/* Bayar */
.uang-cepat { display: flex; gap: 6px; flex-wrap: wrap; }
.pilih-opsi { display: flex; flex-direction: column; gap: 8px; }

/* Struk (meniru kertas thermal) */
.struk {
  font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5;
  background: #fff; border: 1px dashed var(--garis-kuat); border-radius: 6px; padding: 14px; max-width: 340px; margin: 0 auto; width: 100%;
}
.struk__tengah { text-align: center; }
.struk__garis { border-top: 1px dashed var(--garis-kuat); margin: 8px 0; }
.struk__baris { display: flex; justify-content: space-between; gap: 8px; }
.struk__tebal { font-weight: 700; }

@media (max-width: 720px) {
  .pj__barang, .pj__keranjang { height: auto; }
  .pj__grid { max-height: 55vh; }
  .pj__keranjang { border-left: none; border-top: 1px solid var(--garis); }

@media (max-width: 860px) {

    color: var(--peringatan); font-weight: 600; font-size: 13px; cursor: pointer;
  }

}

/* Metode bayar */

}

.kembalian {

/* ---------- Pesanan & Surat Pesanan ---------- */

/* Detail */

}

.ps-dua { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.ps-judul-baris { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

@media (max-width: 860px) {

}

.rt-baris__info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 220px; }
.rt-baris__info .teks-pudar { font-size: 12.5px; }
.rt-baris__isian { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.rt-baris__nilai { min-width: 90px; text-align: right; }
.rt-qty { display: flex; align-items: center; gap: 6px; }
.rt-qty input { width: 64px; height: 36px; text-align: center; }
.rt-qty .teks-pudar { font-size: 12.5px; }
.saklar--kecil { height: 34px; }
.saklar--kecil button { padding: 0 10px; font-size: 13px; }
.rt-cara { display: flex; flex-direction: column; gap: 8px; }
.rt-cara .teks-pudar { font-size: 12.5px; }
.rt-cara--mati { opacity: 0.5; cursor: not-allowed; }
.rt-filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
.rt-filter .pj__cari-kotak { grid-column: span 2; }
@media (max-width: 520px) { .rt-filter .pj__cari-kotak { grid-column: 1 / -1; } }
.rt-langkah { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.rt-langkah li { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--permukaan); border: 1px solid var(--garis); font-size: 13px; font-weight: 600; color: var(--teks-3); }
.rt-langkah li span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--permukaan-2); font-size: 12px; }
.rt-langkah li.aktif { color: var(--biru-tua); border-color: var(--biru-garis); background: var(--biru-muda); }
.rt-langkah li.aktif span { background: var(--biru); color: #fff; }
.rt-langkah li.selesai span { background: #1d6b3c; color: #fff; }
.pp { display: flex; flex-direction: column; gap: 10px; }
.pp__isian { max-width: 220px; }
.pp__rentang { display: grid; grid-template-columns: repeat(2, minmax(0, 200px)); gap: 10px; }
.rw-grup { display: contents; }
.rw-tanggal { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0 6px; font-size: 12.5px; font-weight: 700; color: var(--teks-2); text-transform: uppercase; letter-spacing: 0.03em; border-top: 1px solid var(--garis); }
.rw-grup:first-child .rw-tanggal { border-top: 0; padding-top: 6px; }
.rw-tanggal + .rw-baris { border-top: 0; }
.pp .pj__kategori { flex-wrap: wrap; overflow: visible; }

/* ---------- Kas laci ---------- */
.lc-dua { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lc-aksi { display: flex; gap: 8px; flex-wrap: wrap; }
.lc-angka { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.lc-angka > div { display: flex; flex-direction: column; gap: 2px; }
.lc-angka strong { font-size: 18px; }
.lc-angka .teks-pudar, .lc-angka .teks-bahaya { font-size: 12.5px; }
.lc-bagi-lihat { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; color: var(--teks-2); padding-top: 10px; border-top: 1px solid var(--garis-halus); }
.lc-bagi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lc-nilai { display: flex; flex-direction: column; align-items: flex-end; flex: none; text-align: right; }
.lc-nilai .teks-pudar { font-size: 12px; }
.lc-tutup-penjualan { max-width: 520px; margin: 40px auto; text-align: left; }
.struk--biasa { font-family: inherit; max-width: none; font-size: 14px; }
@media (max-width: 520px) { .lc-dua, .lc-bagi { grid-template-columns: 1fr; } }
.bd-ringkas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.bd-ringkas .kb-angka { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.bd-aktif { border-color: var(--biru) !important; box-shadow: 0 0 0 1px var(--biru); }
.bd-tabel-kartu { padding: 8px 16px; overflow-x: auto; }
.bd-tabel { min-width: 860px; }
.bd-tabel tbody tr { cursor: pointer; }
.bd-tabel tbody tr:hover { background: var(--permukaan-2); }
.bd-tabel tr.bd-pilih { background: var(--biru-muda); }
@media (max-width: 720px) {
  .bd-ringkas { grid-template-columns: 1fr; }
  .bd-tabel { min-width: 0; }
  .bd-tabel-kartu { overflow-x: visible; }
  .bd-tabel td[data-label='Pilih']::before { content: none; }
  .bd-tabel td[data-label='Pilih'] { justify-content: flex-start; }
}
.bd-kepala { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px; }
.bd-kepala__lebar { grid-column: 1 / -1; }
.bd-kepala input[readonly] { background: var(--permukaan-2); color: var(--teks-2); }
.bd-form .input-rp { width: 140px; height: 38px; margin-left: auto; }
.bd-tabel tfoot td { padding-top: 12px; border-top: 1px solid var(--garis); }
.bd-kaki { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 16px; }
.bd-kaki__angka { display: flex; flex-direction: column; gap: 6px; min-width: 300px; flex: 1 1 340px; max-width: 460px; }
@media (max-width: 720px) {
  .bd-kepala { grid-template-columns: 1fr 1fr; }
  .bd-tabel tfoot { display: none; }
  .bd-form .input-rp { width: 150px; }
}
.bd-kepala > * { min-width: 0; }
@media (max-width: 520px) { .bd-kepala { grid-template-columns: 1fr; } }
/* Kas laci: satu bahasa visual */
.kk-bilah {
  display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--radius-besar); background: var(--biru-muda); border: 1px solid var(--biru-garis); font-size: 13.5px;
}
.kk-bilah--tutup { background: var(--peringatan-latar); border-color: #f0d9a8; }
.kk-bilah__info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kk-bilah__angka { display: flex; gap: 16px; flex-wrap: wrap; }
.kk-ringkas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kk-utama { border-color: var(--biru); box-shadow: 0 0 0 1px var(--biru); }
.kk-baris-modal td { background: var(--permukaan-2); }
@media (max-width: 860px) { .kk-ringkas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fk-kepala { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; padding: 12px; border-radius: var(--radius); background: var(--permukaan-2); }
.fk-kepala > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13.5px; }
.fk-kepala .teks-pudar { font-size: 12px; }
.fk-tabel { min-width: 0; font-size: 13px; }
.fk-ringkas { display: flex; flex-direction: column; gap: 4px; margin-left: auto; width: min(100%, 320px); }
@media (max-width: 600px) { .fk-kepala { grid-template-columns: 1fr 1fr; } }
@media (min-width: 721px) {
  .bd-tabel th, .bd-tabel td { white-space: nowrap; }
  .bd-tabel td[data-label='Keterangan'], .bd-tabel td[data-label='Faktur dibayar'] { white-space: normal; min-width: 180px; }
}
.kk-klik { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.pj__kategori--bungkus { flex-wrap: wrap; overflow: visible; }
@media (min-width: 721px) { .bd-tabel td.bd-bungkus { white-space: normal; min-width: 160px; } }
@media (max-width: 860px) { .kk-ringkas { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
@media (max-width: 520px) {
  .kb-angka strong { font-size: 18px; white-space: nowrap; }
  .rt-filter { grid-template-columns: 1fr; }
}
/* Bilah alat daftar + panel filter (tertutup bawaan) */
.kf { display: flex; flex-direction: column; gap: 10px; }
.kf__bilah { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kf__cari { flex: 1 1 260px; max-width: 420px; height: 42px; }
.kf__tombol { display: inline-flex; align-items: center; gap: 6px; height: 42px; flex: none; }
.kf__tombol--aktif { background: var(--biru-muda); border-color: var(--biru-garis); color: var(--biru-tua); }
.kf__ringkas { flex: 1 1 160px; min-width: 0; font-size: 13px; color: var(--teks-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kf__aksi { margin-left: auto; display: flex; gap: 8px; flex: 0 1 auto; min-width: 0; max-width: 100%; }
.kf__aksi .baris-tombol { justify-content: flex-end; }
.kf__panel { padding: 14px 16px; }
@media (max-width: 520px) {
  .kf__cari { flex-basis: 100%; max-width: none; }
  .kf__ringkas { flex-basis: 100%; order: 3; }
  .kf__aksi .baris-tombol { justify-content: flex-start; }
}
.kk-sumber .tombol { height: 40px; }
/* Di HP ringkasan jadi satu baris geser, supaya daftar langsung terlihat */
@media (max-width: 720px) {
  .kk-ringkas { display: flex !important; overflow-x: auto; gap: 10px; padding-bottom: 2px; scroll-snap-type: x mandatory; }
  .kk-ringkas > * { flex: 0 0 64%; scroll-snap-align: start; padding: 10px 14px; }
}

.kk-qty { width: 90px; height: 38px; text-align: right; margin-left: auto; }
.kb-saldo { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.kb-saldo__atas { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.kb-saldo__atas > div { display: flex; flex-direction: column; gap: 2px; }
.kb-saldo__atas strong { font-size: 20px; }

/* Keuangan: buku brankas / rekening, laporan harian toko */
.kf-judul { font-size: 16px; margin: 8px 0 0; }
.lh-tabel { width: 100%; }
.lh-tabel tbody tr { cursor: default; }
.lh-tabel .lh-kelompok td { font-weight: 700; background: var(--permukaan-2); }
.lh-tabel .lh-rinci td:first-child { padding-left: 24px; color: var(--teks-2); }
.lh-tabel tfoot td { padding-top: 12px; border-top: 1px solid var(--garis); }
.lh-catatan { display: flex; flex-direction: column; gap: 8px; padding: 16px; }

@media (max-width: 720px) {
  /* Rincian per kelompok: nama di baris sendiri, 4 angka (laci, brankas, rekening, total) di bawahnya */
  .lh-tabel, .lh-tabel thead, .lh-tabel tbody, .lh-tabel tfoot { display: block; width: 100%; min-width: 0; }
  .lh-tabel thead tr, .lh-tabel tbody tr, .lh-tabel tfoot tr {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--garis-halus);
  }
  .lh-tabel th, .lh-tabel td { display: block; padding: 0; border: 0; font-size: 13px; overflow-wrap: anywhere; }
  .lh-tabel thead th { font-size: 11px; }
  .lh-tabel td:not(:first-child) { white-space: nowrap; font-size: 12px; overflow-wrap: normal; }
  .lh-tabel tr { column-gap: 4px !important; }
  .lh-tabel th:first-child, .lh-tabel td:first-child { grid-column: 1 / -1; padding: 0 0 4px; }
  .lh-tabel thead th:first-child { display: none; }
  .lh-tabel .lh-rinci td:first-child { padding-left: 12px; }
  .lh-tabel .lh-kelompok { background: var(--permukaan-2); }
  .lh-tabel .lh-kelompok td { background: none; }
  .lh-tabel td[colspan] { grid-column: 1 / -1; }
}

@media (max-width: 720px) {
  /* Total uang toko tetap tampil di HP */
  .bd-tabel.lh-posisi tfoot { display: table-footer-group; }
  .lh-posisi tfoot tr { background: var(--permukaan-2); padding: 12px 8px; border-radius: 8px; }
  .lh-posisi tfoot td { padding-top: 0; border-top: 0; }
  .lh-posisi .lh-kosong { display: none; }
}

/* Stok Barang */
.sb-umur { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sb-umur--normal { background: var(--permukaan-2); color: var(--teks-2); }
.sb-umur--kuning { background: #fff6d6; color: #8a6200; }
.sb-umur--oranye { background: #ffe7d1; color: #a24a00; }
.sb-umur--merah { background: var(--bahaya-latar); color: var(--bahaya); }
.sb-tipis { color: #a24a00; }
.sb-harga { display: flex; flex-direction: column; gap: 2px; font-size: 13px; white-space: nowrap; }
.sb-untung { color: #1d6b3c; font-size: 12px; }
.sb-kepala-info { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sb-tab { display: flex; gap: 4px; border-bottom: 1px solid var(--garis); overflow-x: auto; scrollbar-width: none; }
.sb-tab button { border: none; background: none; padding: 10px 14px; font: inherit; font-weight: 600; color: var(--teks-2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.sb-tab button[aria-selected='true'] { color: var(--biru); border-bottom-color: var(--biru); }
.sb-ringkasan { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 18px; }
.sb-angka { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sb-angka > span { font-size: 12.5px; }
.sb-angka > strong { font-size: 16px; overflow-wrap: anywhere; }
.sb-lebar { grid-column: 1 / -1; }
.sb-cek { display: flex; flex-direction: column; gap: 8px; font-weight: 500; }
.sb-cek label { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sb-tingkat { display: grid; grid-template-columns: 180px 220px max-content; justify-content: start; gap: 12px; align-items: end; }
@media (max-width: 900px) { .sb-ringkasan { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .sb-ringkasan { grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
  .sb-tingkat { grid-template-columns: 1fr 1fr; }
  .sb-harga { white-space: normal; align-items: flex-end; }
}
.sb-gerak { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
@media (max-width: 720px) { .sb-gerak { align-items: flex-end; } }
.sb-persen { display: inline-flex; align-items: center; gap: 4px; justify-content: flex-end; }
.sb-persen input { width: 76px; height: 38px; text-align: right; }
.sb-persen--merah input { color: var(--bahaya); border-color: var(--bahaya); }
.sb-label { margin-top: 6px; height: 34px; font-size: 13px; }
.sb-form-harga .input-rp { width: 130px; }
@media (max-width: 720px) {
  .sb-form-harga td[data-label='Satuan'] { flex-direction: column; align-items: stretch; text-align: left; }
  .sb-form-harga td[data-label='Satuan']::before { margin-bottom: 4px; }
}
.sb-form-harga { min-width: 0 !important; table-layout: auto; }
.sb-form-harga td[data-label='Satuan'] { width: 230px; }
.sb-form-harga td[data-label='Satuan'] > select, .sb-form-harga .sb-label { display: block; width: 100%; }
.sb-form-harga .kk-qty { width: 72px; }
.sb-form-harga .input-rp { width: 150px; }
.sb-form-harga .sb-persen input { width: 64px; }
.sb-form-harga th, .sb-form-harga td { padding-left: 6px; padding-right: 6px; }
.sb-isi { display: flex; gap: 6px; align-items: center; }
.sb-isi .kk-qty { margin-left: 0; width: 64px; }
.sb-isi select { width: 110px; height: 38px; }
.sb-ubah-beli { font-size: 12px; color: #a24a00; max-width: 150px; margin-left: auto; text-align: right; }
.sb-perdasar { font-size: 12px; color: var(--teks-3); margin-top: 2px; }
.sb-mahal { font-size: 12px; color: var(--bahaya); font-weight: 600; margin-top: 2px; max-width: 170px; margin-left: auto; }

/* Barang Masuk */
.bm-barang { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.bm-barang__kepala { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bm-lapis { width: 100%; }
.bm-lapis .input-rp { width: 150px; margin-left: auto; }
.bm-lapis tbody tr { cursor: default; }
.bm-barang__kaki { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; border-top: 1px solid var(--garis-halus); padding-top: 10px; }
.bm-cek { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.bm-cek label { display: flex; gap: 8px; align-items: center; }
.bm-angka { display: flex; flex-direction: column; gap: 6px; min-width: 300px; flex: 1 1 320px; max-width: 480px; }
.bm-diskon { display: flex; gap: 8px; align-items: center; justify-content: flex-end; font-size: 14px; }
.bm-diskon > span:first-child { margin-right: auto; color: var(--teks-2); }
.bm-diskon .input-rp { width: 140px; }
.bm-usulan { display: flex; flex-direction: column; gap: 6px; background: #fff6d6; border-radius: 8px; padding: 10px 12px; font-size: 14px; }

@media (max-width: 720px) {
  .bm-angka { min-width: 0; max-width: none; }
  .bm-lapis .input-rp { width: 140px; }
}


/* ===== TOKOKU Lite: padanan kelas prototipe ke gaya TOKOKU ===== */
:root{--bg:var(--latar);--surface:var(--permukaan);--surface2:var(--permukaan-2);--fg:var(--teks);--muted:var(--teks-3);--line:var(--garis-kuat);
 --accent:var(--biru);--accent-fg:#fff;--accent-soft:var(--biru-muda);--accent-ink:var(--biru-tua);
 --good:#1d6b3c;--good-soft:#e6f6ec;--warn:var(--peringatan);--warn-soft:var(--peringatan-latar);--bad:var(--bahaya);--bad-soft:var(--bahaya-latar);
 --paper:#fffef9;--paper-ink:#1d1d1d;--shadow:0 18px 48px rgba(23,32,51,.18);--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
body{background:var(--latar);color:var(--teks)}
.ps-halaman .ph h1{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.panel{background:var(--permukaan);border:1px solid var(--garis);border-radius:var(--radius-besar);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hint{color:var(--teks-3);font-size:13px;margin:2px 0 0}.muted{color:var(--teks-3)}
label,.lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--teks-3)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>.field{flex:1 1 170px}
input:not([type=checkbox]):not([type=radio]),select,textarea{height:42px;padding:0 12px;border:1px solid var(--garis-kuat);border-radius:var(--radius);background:var(--permukaan);font-size:14px;width:100%;min-width:0}
textarea{height:auto;padding:10px 12px;min-height:60px}
.pj__cari-kotak input,.input-rp input,.stepper input{height:100%!important;border:none!important;padding:0!important;background:transparent!important;border-radius:0!important}
.stepper input{width:60px!important}.stepper--besar input{width:72px!important}
.atur-tombol .btn.primary{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--garis-kuat);background:var(--permukaan);font-weight:600;cursor:pointer;text-decoration:none;color:var(--teks);white-space:nowrap}
.btn:hover{background:var(--permukaan-2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--biru);border-color:var(--biru);color:#fff}.btn.primary:hover{background:var(--biru-tua)}
.btn.good{background:#1d6b3c;border-color:#1d6b3c;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teks-2);font-weight:500}
.btn.danger{color:var(--bahaya);border-color:#f1c4bf}.btn.danger:hover{background:var(--bahaya-latar)}
.btn.lg{height:52px;font-size:16px}.btn.sm{height:32px;padding:0 10px;font-size:13px}.btn.block{width:100%}
.link,.back{border:none;background:none;padding:0;color:var(--biru);font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.link:hover,.back:hover{color:var(--biru-tua);text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--permukaan-2);color:var(--teks-3)}
.chip.blue{background:var(--biru-muda);color:var(--biru-tua)}.chip.warn{background:var(--peringatan-latar);color:var(--peringatan)}
.chip.bad{background:var(--bahaya-latar);color:var(--bahaya)}.chip.good{background:#e6f6ec;color:#1d6b3c}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

function lokal(c,id,data,gabung){const i=S[c].findIndex(x=>x.id===id);const isi=JSON.parse(JSON.stringify(data));if(i>=0)S[c][i]=gabung?{...S[c][i],...isi}:{id,...isi};else if(!gabung)S[c].push({id,...isi});}
async function put(c,id,data){if(S.mode==="sb"){const isi=JSON.parse(JSON.stringify(data));delete isi.id;lokal(c,id,isi,false);afterData();const {error}=await SB.from(c).upsert({id,data:isi,diubah:new Date().toISOString()});if(error)throw sbErr(error);return;}if(S.db)await S.db.collection(c).doc(id).set(data);else{const i=S[c].findIndex(x=>x.id===id);const o={id,...data};if(i>=0)S[c][i]=o;else S[c].push(o);afterData();}}

/* ================= harga ================= */
function priceOf(p,si,qty,pelId){
  const s=p.satuan[si];let normal=s.jual,tier=null,next=null;
  if(s.isi===1&&p.tingkat&&p.tingkat.length){const t=p.tingkat.slice().sort((a,b)=>a.min-b.min);for(const x of t){if(qty>=x.min){normal=x.harga;tier=x;}else if(!next)next=x;}}
  let disk=0;const pl=pelId&&pelg(pelId);const d=pl&&(pl.diskon||[]).find(x=>x.pid===p.id);
  if(d){disk=d.tipe==="pct"?Math.round(normal*d.nilai/100):d.nilai*s.isi;}
  disk=Math.min(disk,normal);
  return{normal,disk,tier,next};
}
function reprice(c){c.items.forEach(it=>{if(it.locked)return;const p=prod(it.pid);if(!p)return;const si=p.satuan.findIndex(s=>s.nama===it.sat&&s.isi===it.isi);if(si<0)return;const pr=priceOf(p,si,it.qty,c.pelangganId);it.normal=it.hargaManual||pr.normal;if(it.dariHarga&&it.hargaKetik)it.disk=Math.max(0,pr.normal-it.hargaKetik);it.diskSaran=pr.disk;if(!it.diskManual)it.disk=pr.disk;it.beli=p.satuan[si].beli||0;});}
const lineTotal=it=>it.qty*(it.normal-(it.disk||0));
const cartSub=c=>c.items.reduce((a,i)=>a+lineTotal(i),0);
function tierHint(it){const p=prod(it.pid);if(!p||it.isi!==1||!p.tingkat?.length)return"";const pr=priceOf(p,p.satuan.findIndex(s=>s.isi===1),it.qty,"");if(!pr.next)return pr.tier?`Harga grosir ≥ ${fq(pr.tier.min)}`:"";const kurang=pr.next.min-it.qty;const totNext=pr.next.min*pr.next.harga;const totNow=it.qty*pr.normal;if(kurang<=Math.max(2,pr.next.min*0.2)&&totNext<=totNow+pr.next.harga)return`Tambah ${fq(kurang)} lagi → ${rp(pr.next.harga)}/${it.sat} (total ${rp(totNext)})`;return"";}

function aturHasil(m){
  const p=prod(m.pid);const c=cart();const s=p.satuan[m.si];const qty=Math.max(0,Math.floor(qn(m.qty)));
  if(!qty)return null;const pr=priceOf(p,m.si,qty,c.pelangganId);const bruto=qty*pr.normal;const saran=pr.disk*qty;
  const def=pr.normal;const hk=money(m.htext||"");
  if((m.htext||"").trim()!==""&&hk>0){
    if(hk>=def){const b2=qty*hk;return{p,s,qty,normal:hk,def,naik:hk>def,dariHarga:false,tier:pr.tier,next:pr.next,bruto:b2,saran,diskon:0,manual:0,netto:b2};}
    const d=(def-hk)*qty;return{p,s,qty,normal:def,def,dariHarga:true,tier:pr.tier,next:pr.next,bruto,saran,diskon:d,manual:d,netto:bruto-d};}
  const v=money(m.dtext);const manual=m.dtext.trim()===""?null:(m.dmode==="unit"?v*qty:v);
  const diskon=Math.min(bruto,manual==null?saran:manual);
  return{p,s,qty,normal:def,def,tier:pr.tier,next:pr.next,bruto,saran,diskon,manual,netto:bruto-diskon};
}
function mAtur(m){

  ${p.tingkat?.length?`<p class="catatan catatan--info">Harga bertingkat per ${esc(dasar)}: ${rp(p.satuan[0].jual)} · ${p.tingkat.slice().sort((a,b)=>a.min-b.min).map(t=>`${fq(t.min)}+ ${rp(t.harga)}`).join(" · ")}</p>`:""}
  <div class="atur-bagian"><label for="atur-harga" class="lbl">Harga per ${esc(s.nama.toLowerCase())}</label><div class="input-rp"><span aria-hidden="true">Rp</span><input id="atur-harga" inputmode="numeric" value="${esc(m.htext||"")}" data-atur="htext" placeholder="${h?rn(h.def):rn(s.jual)}"></div><div id="atur-hbantu">${hargaBantu(m,h)}</div></div>
  <div class="atur-bagian"><label for="atur-jumlah" class="lbl">Jumlah</label><div class="stepper stepper--besar"><button data-act="aturQty" data-d="-1" aria-label="Kurangi">−</button><input id="atur-jumlah" inputmode="numeric" value="${esc(m.qty)}" data-atur="qty"><button data-act="aturQty" data-d="1" aria-label="Tambah">+</button></div><div id="atur-next">${nextNote}</div></div>
  <div class="atur-bagian"><div class="atur-diskon-kepala"><label for="atur-diskon" class="lbl">Diskon</label><div class="saklar saklar--kecil" role="group" aria-label="Cara hitung diskon"><button data-act="aturDmode" data-m="unit" aria-pressed="${m.dmode==="unit"}">Per ${esc(unit)}</button><button data-act="aturDmode" data-m="total" aria-pressed="${m.dmode==="total"}">Total</button></div></div>
  <div class="input-rp"><span aria-hidden="true">Rp</span><input id="atur-diskon" inputmode="numeric" value="${esc(m.dtext)}" data-atur="dtext" placeholder="${adaSaran&&h?rn(h.saran)+" (otomatis)":"0"}"></div>

function hargaBantu(m,h){const unit=prod(m.pid).satuan[m.si].nama.toLowerCase();if(!h)return"";
  if(h.dariHarga)return `<p class="catatan catatan--info">Lebih murah dari harga bawaan ${rp(h.def)} → dicatat sebagai diskon ${rp(h.def-money(m.htext))}/${esc(unit)}.</p><button class="link" data-act="aturHargaReset">Kembali ke harga bawaan ${rp(h.def)}</button>`;
  if(h.naik)return `<p class="catatan catatan--peringatan">Harga dinaikkan dari ${rp(h.def)}.</p><button class="link" data-act="aturHargaReset">Kembali ke harga bawaan ${rp(h.def)}</button>`;
  return `<p class="hint" style="margin:0">Harga bawaan ${rp(h.def)}/${esc(unit)}. Ketik harga lain bila lebih mudah; yang lebih murah otomatis jadi diskon.</p>`;}
function aturBantu(m,h,adaSaran){const c=cart();const nm=esc(pelg(c.pelangganId)?.nama||"");const unit=prod(m.pid).satuan[m.si].nama.toLowerCase();let o="";

function hutAlok(ns,m){

}

  return rows;

async function putBanyak(c,docs){

function lapData(s,e){
  const inR=iso=>{if(!iso)return false;const t=new Date(iso);return t>=s&&t<e;};
  const ns=S.nota.filter(n=>n.status==="dibayar"&&n.jenis!=="lama"&&inR(n.dibayarAt));
  const penjualan=ns.reduce((a,n)=>a+n.subtotal-(n.potongan||0),0);const pot=ns.reduce((a,n)=>a+(n.potongan||0),0);
  let diskPel=0,diskMan=0,marginItems=0;const kat={},brg={},kos={};
  ns.forEach(n=>n.items.forEach(it=>{if(!(it.qty>0)&&!(it.pesan>0))return;const d=(it.disk||0)*it.qty;if(it.diskManual)diskMan+=d;else diskPel+=d;const o=lineTotal(it);const mg=o-it.qty*(it.beli||0);marginItems+=mg;(kat[it.kategori]||(kat[it.kategori]={o:0,m:0}));kat[it.kategori].o+=o;kat[it.kategori].m+=mg;const p=prod(it.pid);const b=brg[it.pid]||(brg[it.pid]={nama:it.nama,q:0,o:0,m:0,dasar:p?.satuan[0].nama||""});b.q+=it.qty*(it.isi||1);b.o+=o;b.m+=mg;
    if(it.pesan!=null&&it.qty<it.pesan&&(it.ket==="Barang kosong"||it.ket==="Stok kurang")){const k=kos[it.pid]||(kos[it.pid]={nama:it.nama,n:0,kurang:0,sat:it.sat});k.n++;k.kurang+=it.pesan-it.qty;}}));
  const belT=ns.reduce((a,n)=>a+Math.max(0,n.bayar?.tunai||0),0),belR=ns.reduce((a,n)=>a+Math.max(0,n.bayar?.transfer||0),0),hutBaru=ns.reduce((a,n)=>a+(n.bayar?.hutang||0),0)+S.nota.filter(n=>n.jenis==="lama"&&inR(n.dibayarAt)).reduce((a,n)=>a+n.bayar.hutang,0);
  const kredit=ns.reduce((a,n)=>a+(n.kredit?.nilai||0),0);
  const refT=ns.reduce((a,n)=>a+(n.refund?.metode==="tunai"?n.refund.jumlah:0),0),refR=ns.reduce((a,n)=>a+(n.refund?.metode==="transfer"?n.refund.jumlah:0),0);
  const ret=S.retur.filter(r=>inR(r.tanggal));const returNilai=ret.reduce((a,r)=>a+r.nilai,0);const returCost=ret.reduce((a,r)=>a+r.items.reduce((b,i)=>b+i.qty*(i.beli||0),0),0);
  const rUangT=ret.filter(r=>r.penyelesaian==="uang"&&r.metode==="tunai").reduce((a,r)=>a+r.nilai,0),rUangR=ret.filter(r=>r.penyelesaian==="uang"&&r.metode==="transfer").reduce((a,r)=>a+r.nilai,0);
  const bh=S.bayar.filter(b=>inR(b.tanggal));const hbT=bh.filter(b=>b.metode==="tunai").reduce((a,b)=>a+b.jumlah,0),hbR=bh.filter(b=>b.metode==="transfer").reduce((a,b)=>a+b.jumlah,0),hbRetur=bh.filter(b=>b.metode==="retur").reduce((a,b)=>a+b.jumlah,0);
  const omzet=penjualan-returNilai;const margin=marginItems-pot-(returNilai-returCost);
  return{ns,nNota:ns.length,penjualan,pot,diskPel,diskMan,belT,belR,hutBaru,kredit,retur:ret,returNilai,omzet,margin,hbT,hbR,hbRetur,
    inT:belT+hbT-rUangT-refT,inR:belR+hbR-rUangR-refR,rUangT,rUangR,refT,refR,
    kat:Object.entries(kat).map(([k,v])=>({k,...v})).sort((a,b)=>b.o-a.o),brg:Object.values(brg).sort((a,b)=>b.o-a.o),kosong:Object.values(kos).sort((a,b)=>b.n-a.n)};
}

function perHTML(i){const e=S.edit;const s=e.satuan[i];const isi=isiOf(e,i);const j=money(s.jual);const u=money(s.beli)&&j?(j-money(s.beli))/money(s.beli)*100:null;
  let h="";if(i>0&&isi>1){h+=`1 ${esc(s.nama)} = ${fq(isi)} ${esc(e.satuan[0].nama)}`;if(j){const per=j/isi;const prev=money(e.satuan[i-1].jual)/(isiOf(e,i-1)||1);h+=`<br><span class="muted">${rp(per)}/${esc(e.satuan[0].nama)}</span>${prev&&per>prev?` <b style="color:var(--bad)">⚠ +${rp(per-prev)}</b>`:""}`;}}

function belanjaPelanggan(s,e){const m={};let bebasN=0,bebasO=0;S.nota.forEach(n=>{if(n.status!=="dibayar"||n.jenis==="lama"||!n.dibayarAt)return;const t=new Date(n.dibayarAt);if(t<s||t>=e)return;const tot=n.subtotal-(n.potongan||0);
  if(n.pelangganId){const x=m[n.pelangganId]||(m[n.pelangganId]={n:0,o:0,last:""});x.n++;x.o+=tot;if(n.dibayarAt>x.last)x.last=n.dibayarAt;}else{bebasN++;bebasO+=tot;}});return{m,bebasN,bebasO};}

  else if(F==="baru")list=list.filter(p=>p.dibuat&&new Date(p.dibuat)>=ps&&new Date(p.dibuat)<pe).sort(byNama);

  <section class="panel"><input type="search" id="pelq" data-pelq="1" placeholder="Cari nama, telepon, alamat…" value="${esc(S.pelQ)}">
  ${F!=="semua"?`<p class="catatan catatan--info">Menampilkan: ${({aktif:"pelanggan yang belanja di periode, terbesar dulu",hutang:"pelanggan yang masih berhutang",baru:"pelanggan yang didaftarkan di periode"})[F]} · <button class="link" data-act="pelf" data-v="semua">tampilkan semua</button></p>`:""}
  ${list.length?`<div class="tw"><table><thead><tr><th>Nama</th><th>No. telepon</th><th>Alamat</th><th class="n">Nota periode</th><th class="n">Belanja periode</th><th>Terakhir belanja</th><th class="n">Sisa hutang</th></tr></thead><tbody>${list.map(p=>{const h=sisaHutang(p.id);const x=B.m[p.id];return `<tr class="click" data-act="openpel" data-id="${p.id}"><td><b>${esc(p.nama)}</b>${p.contoh?'<span class="tag-c">contoh</span>':""}${(p.diskon||[]).length?' <span class="chip good">diskon</span>':""}</td><td>${esc(p.telp||"–")}</td><td>${esc(p.alamat||"–")}</td><td class="n">${x?x.n+"×":"–"}</td><td class="n">${x?rp(x.o):"–"}</td><td>${x?tgl(x.last):"–"}</td><td class="n">${h?`<b style="color:var(--warn)">${rp(h)}</b>`:"–"}</td></tr>`;}).join("")}</tbody>

    doc.bayar={tunai:r.belTunai,transfer:r.belTransfer,hutang:r.hutang,bank:(m.bank||"").trim()};doc.uangDiterima=r.tunai;doc.kembalian=r.kembalian;doc.bayarHutang=r.hbDibayar;}

function kecilkanFoto(file,maks=480,mutu=0.75){return new Promise((ok,no)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const r=Math.min(1,maks/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?ok({blob:b,dataUrl:c.toDataURL("image/jpeg",mutu)}):no(new Error("Foto tidak bisa diproses")),"image/jpeg",mutu);};
  img.onerror=()=>{URL.revokeObjectURL(url);no(new Error("File bukan gambar"));};img.src=url;});}
async function unggahFoto(file,pid){const {blob,dataUrl}=await kecilkanFoto(file);

  const {error}=await st.upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000",upsert:false});if(error)throw sbErr(error);
  return{foto:st.getPublicUrl(path).data.publicUrl,fotoPath:path};}

/* ================= event ================= */
document.addEventListener("click",e=>{if(S.ppOpen&&!e.target.closest(".pp1")){S.ppOpen=null;render();}const b=e.target.closest("[data-act]");if(!b)return;if(b.tagName==="A"&&!b.getAttribute("href").startsWith("#"))return;if(b.tagName==="A")e.preventDefault();const f=ACT[b.dataset.act];if(!f)return;if(b.tagName==="BUTTON")e.preventDefault();if(b.dataset.act==="openpel"&&b.closest("tr.click"))e.stopPropagation();f(b,e);});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.lg){S.login[d.lg]=d.lg==="pin"?t.value.replace(/\D/g,"").slice(0,6):t.value;if(d.lg==="pin"&&t.value!==S.login.pin)t.value=S.login.pin;S.login.err="";return;}
  if(d.ak&&S.akunEdit){S.akunEdit[d.ak]=d.ak.startsWith("pin")?t.value.replace(/\D/g,"").slice(0,6):t.value;if(d.ak.startsWith("pin")&&t.value!==S.akunEdit[d.ak])t.value=S.akunEdit[d.ak];return;}
  if(d.posq){S.q=t.value;const g=$("#grid");if(g)g.innerHTML=gridHTML();return;}
  if(d.qty!==undefined){const c=cart();const it=c.items[+d.qty];const q=qn(t.value);if(q>=0&&t.value!==""){it.qty=q;reprice(c);}return;}
  if(d.atur){const m=S.modal;if(d.atur==="qty")m.qty=t.value.replace(/\D/g,"");else{const v=t.value.replace(/\D/g,"");const f=v?Number(v).toLocaleString("id-ID"):"";if(t.value!==f)t.value=f;
    if(d.atur==="htext"){m.htext=f;m.dtext="";const di=$("#atur-diskon");if(di)di.value="";}else{m.dtext=f;m.htext="";const hi=$("#atur-harga");if(hi)hi.value="";}}refreshAtur();return;}
  if(d.pay){const m=S.modal;if(d.pay==="bank"){m.bank=t.value;return;}const v=t.value.replace(/\D/g,"");m[d.pay]=v;refreshPay(t.id);return;}
  if(d.namapel){t.classList.remove("isian--salah");const c=cart();const v=t.value;const ex=S.pelanggan.find(p=>norm(p.nama)===norm(v)&&v.trim());const was=c.pelangganId;
    if(ex){c.pelangganId=ex.id;c.namaBebas="";}else{c.pelangganId="";c.namaBebas=v;}
    if(was!==c.pelangganId){c.items.forEach(i=>{if(!i.locked&&!i.dariHarga)i.diskManual=false;});reprice(c);const l=document.querySelector(".pj__baris");if(l)l.innerHTML=c.items.map((it,i)=>lineHTML(it,i,c)).join("")||`<li class="pj__kosong">Keranjang kosong.</li>`;}
    $("#pel-info").innerHTML=pelInfo(c);$("#pel-saran").innerHTML=ex?"":pelSaran(v);return;}
  if(d.rq!==undefined){S.modal.q[d.rq]=t.value;const n=S.nota.find(x=>x.id===S.modal.id);const f=returFactor(n);const rq=n.returQty||{};const v=n.items.reduce((a,it,i)=>a+Math.min(qn(S.modal.q[i]||0),it.qty-(rq[i]||0))*(it.normal-(it.disk||0))*f,0);$("#rv").textContent=rp(v);const btn=document.querySelector('[data-act="doretur"]');if(btn)btn.disabled=!(v>0);return;}
  if(d.riwq){S.riw.q=t.value;clearTimeout(S.rt);S.rt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$("#riwq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},300);return;}
  if(d.pelq){S.pelQ=t.value;clearTimeout(S.pt);S.pt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$("#pelq");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},300);return;}
  if(d.prodq){S.prodQ=t.value;const q=norm(t.value);const l=$("#plist");if(l){const list=S.produk.filter(p=>(!q||norm(p.nama+p.sku+(p.kode||"")+(p.pabrikan||"")).includes(q))&&(!S.prodK||p.kategori===S.prodK)).sort((a,b)=>(a.aktif===false)-(b.aktif===false)||byNama(a,b));l.innerHTML=prodList();}return;}
  if(d.pf&&S.edit){if(d.pf==="aktif")S.edit.aktif=t.checked;else S.edit[d.pf]=t.value;return;}
  if(d.sf&&S.edit){const i=+d.i,s=S.edit.satuan[i];s[d.sf]=t.value;
    if(d.sf==="pct"){const b=money(s.beli);if(b&&t.value!==""){s.jual=String(Math.round(b*(1+qn(t.value)/100)));const j=document.querySelector(`[data-sf="jual"][data-i="${i}"]`);if(j)j.value=s.jual;}}
    else if(d.sf==="jual"||d.sf==="beli"){s.pct=undefined;const p=document.querySelector(`[data-sf="pct"][data-i="${i}"]`);if(p)p.value=pctVal(s);}
    S.edit.satuan.forEach((_,j)=>{const x=$("#per-"+j);if(x)x.innerHTML=perHTML(j);});return;}
  if(d.tf&&S.edit){S.edit.tingkat[+d.i][d.tf]=t.value;return;}
  if(d.dk&&S.pelDisk){S.pelDisk[+d.i][d.dk]=t.value;return;}
  if(d.hjml&&S.hutForm){S.hutForm.jml=t.value;S.hutForm.amt={};hutRefresh();return;}
  if(d.hamt&&S.hutForm){S.hutForm.amt[d.hamt]=t.value;const al=hutAlok(notaHutang(S.hut),S.hutForm);const tot=al.reduce((a,x)=>a+x.x,0);$("#h-tot").textContent=rp(tot);const btn=document.querySelector('[data-act="hbayar"]');if(btn){btn.disabled=!tot;btn.textContent="Terima "+rp(tot);}return;}
  if(d.hbank&&S.hutForm){S.hutForm.bank=t.value;return;}
});
function hutRefresh(){const al=hutAlok(notaHutang(S.hut),S.hutForm);const tot=al.reduce((a,x)=>a+x.x,0);document.querySelectorAll("[data-hamt]").forEach(inp=>{const a=al.find(x=>x.n.id===inp.dataset.hamt);inp.value=a?a.x:"";});$("#h-tot").textContent=rp(tot);const btn=document.querySelector('[data-act="hbayar"]');if(btn){btn.disabled=!tot;btn.textContent="Terima "+rp(tot);}}
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.qty!==undefined){const c=cart();if(c.items[+d.qty].qty===0&&!(c.fromAntrian&&c.items[+d.qty].pesan!=null))c.items.splice(+d.qty,1);reprice(c);refreshCart();return;}
  if(d.akr&&S.akunEdit){S.akunEdit.peran=t.value;return;}
  if(d.peran){S.role=t.value;try{localStorage.setItem('tkl2-role',S.role);}catch(_){}S.view='pos';S.modal=null;render();autoSlip();return;}
  if(d.pel){const c=cart();c.pelangganId=t.value;if(t.value)c.namaBebas="";c.items.forEach(i=>{if(!i.locked)i.diskManual=false;});reprice(c);refreshCart();return;}
  if(d.hbon){S.modal.hbOn=t.checked;if(t.checked&&S.modal.met==="hutang")S.modal.met="tunai";refreshPay();return;}
  if(d.kurang){S.modal.kurang=d.kurang;refreshPay();return;}
  if(d.ket!==undefined){cart().items[+d.ket].ket=t.value;return;}
  if(d.pf==="kategori"){S.edit.kategori=t.value;render();return;}
  if(d.pf==="jenis"){S.edit.jenis=t.value;return;}
  if(d.sf==="nama"){S.edit.satuan[+d.i].nama=t.value;render();return;}
  if(d.prodk){S.prodK=t.value;render();return;}
  if(d.fotoform&&S.edit){const f=t.files&&t.files[0];if(!f)return;S.fotoSibuk="form";render();unggahFoto(f,S.edit.id).then(x=>{if(S.edit){S.edit.foto=x.foto;S.edit.fotoPath=x.fotoPath;}}).catch(fail).finally(()=>{S.fotoSibuk=null;render();});return;}
  if(d.fotocepat){const f=t.files&&t.files[0];if(f)fotoCepat(d.fotocepat,f);return;}
  if(d.tanpafoto!==undefined){S.prodTanpaFoto=t.checked;render();return;}
  if(d.hutall){S.hutAll=t.checked;render();return;}
  if(d.hsel&&S.hutForm){S.hutForm.sel[d.hsel]=t.checked;S.hutForm.amt={};hutRefresh();return;}
  if(d.hmet&&S.hutForm){S.hutForm.met=t.value;return;}
  if(d.ral){S.modal.al=t.value;return;}
  if(d.dk&&S.pelDisk){S.pelDisk[+d.i][d.dk]=t.value;render();return;}
  if(d.imporfile){const f=t.files&&t.files[0];if(!f)return;S.imp={rows:[],perbarui:false,sibuk:true};renderModal();bacaImpor(f).then(rows=>{S.imp={rows,perbarui:false};if(!rows.length)S.imp.err="Tidak ada baris produk di file. Isi mulai baris 3 sheet Produk.";renderModal();}).catch(e=>{console.error(e);S.imp={rows:[],err:"File tidak bisa dibaca. Pastikan memakai template .xlsx dari aplikasi."};renderModal();});return;}
  if(d.imporperbarui){S.imp.perbarui=t.checked;renderModal();return;}
  if(d.autoslip){saveSetting({autoSlip:t.checked}).catch(fail);return;}
  if(d.riwpm){S.riw.month=t.value;S.ppOpen=null;render();return;}if(d.riwpf){S.riw.from=t.value;render();return;}if(d.riwpt){S.riw.to=t.value;render();return;}
  if(d.lappm){S.lap.month=t.value;S.ppOpen=null;render();return;}if(d.lappf){S.lap.from=t.value;render();return;}if(d.lappt){S.lap.to=t.value;render();return;}
});
document.addEventListener("submit",e=>{if(e.target.dataset.login){e.preventDefault();cobaMasuk();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal&&!S.printing){S.modal=null;renderModal();}if(e.key==="Enter"&&e.target.dataset.posq){const t=document.querySelector("#grid .kartu-barang");if(t){e.preventDefault();t.click();}}if(e.key==="Enter"&&e.target.dataset.atur){e.preventDefault();aturSimpan();}});

/* ================= mulai ================= */
let SB=null;
(async()=>{
  render();
  const cfg=window.TKL_SB;
  if(cfg&&window.supabase&&!window.claude){SB=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"tkl-sb"}});S.mode="sb";
    const {data:{session}}=await SB.auth.getSession();if(session)await masukSB();else render();
    SB.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"&&S.user){S.user=null;render();}});
    return;}
  let db=null;try{db=window.claude?await window.claude.use("db"):null;}catch(e){db=null;}
  if(db){S.db=db;S.mode="db";const got=new Set();
    COLS.forEach(c=>{try{db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));got.add(c);if(c==="pengaturan"&&!S.loadedPengaturan){S.loadedPengaturan=true;render();}if(got.size===COLS.length&&S.mode==="db")afterData();else scheduleRender();},err=>{console.error(err);toast("Sambungan data terputus. Muat ulang halaman.");});}catch(e){console.error(e);}});
  }else S.mode="mem";
  render();autoSlip();
})();
</script>
